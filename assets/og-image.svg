<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="ECG, Enriquez Chat Group — Compite con tus ideas. Destaca con tu talento. Crece con tus resultados.">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#C4162B" stop-opacity=".34"/>
      <stop offset="55%" stop-color="#C4162B" stop-opacity=".1"/>
      <stop offset="100%" stop-color="#C4162B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F4F6"/>
      <stop offset=".48" stop-color="#8A8A93"/>
      <stop offset="1" stop-color="#E8E8EC"/>
    </linearGradient>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0v72" fill="none" stroke="#F2F2F4" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#0A0A0B"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="1010" cy="315" r="470" fill="url(#glow)"/>

  <!-- Emblema -->
  <g transform="translate(905 150) scale(2.55)">
    <path d="M50 3 L95 19 V62 C95 92 73 111 50 117 C27 111 5 92 5 62 V19 Z" fill="#141416" stroke="url(#metal)" stroke-width="2.6"/>
    <path d="M50 10 L88 23 V62 C88 87 70 103 50 109 C30 103 12 87 12 62 V23 Z" fill="none" stroke="#C4162B" stroke-width=".9"/>
    <line x1="50" y1="22" x2="50" y2="104" stroke="url(#metal)" stroke-width="1"/>
    <g transform="translate(2,34) scale(.54)">
      <path d="M8 54 C 12 46, 18 41, 26 37 C 31 34.5, 33.5 31.5, 34.5 27.5 L 29 13 L 43 23.5 C 47 21, 51 20.5, 55 22 L 61 9 L 69.5 26 C 74 32, 76 42, 74 52 C 72 64, 67.5 74, 59 82 C 47 87, 33 79, 25.5 70 C 19 64, 12 58, 8 54 Z" fill="#E8404A"/>
      <path d="M27 44.5 C 30 42.5, 34 42.5, 36.5 45 C 34 47, 30 47.5, 27 44.5 Z" fill="#141416"/>
      <path d="M9.5 52.5 L15 50.5 L13.5 55 Z" fill="#141416"/>
      <path d="M13.5 55 C 16 59, 20 60.5, 24 59.5" fill="none" stroke="#141416" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g fill="#F2F2F4" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="700" text-anchor="middle" letter-spacing="1">
      <text x="72" y="53">E</text>
      <text x="72" y="72">C</text>
      <text x="72" y="91">G</text>
    </g>
  </g>

  <!-- Texto -->
  <text x="88" y="196" fill="#9C9CA7" font-family="Consolas, monospace" font-size="18" letter-spacing="4.2">ENRIQUEZ CHAT GROUP</text>

  <text x="88" y="268" fill="#F2F2F4" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="700" letter-spacing="8">ECG</text>

  <g fill="#F2F2F4" font-family="Georgia, 'Times New Roman', serif" font-size="40" letter-spacing="-.4">
    <text x="88" y="368">Compite con tus ideas.</text>
    <text x="88" y="424">Destaca con tu <tspan fill="#E8404A">talento</tspan>.</text>
    <text x="88" y="480">Crece con tus resultados.</text>
  </g>

  <rect x="88" y="524" width="172" height="4" rx="2" fill="#E8404A"/>
</svg>
