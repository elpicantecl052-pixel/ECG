<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="ECG — Compite con tus ideas. Destaca con tu talento. Crece con tus resultados.">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#E8B13A" stop-opacity=".2"/>
      <stop offset="55%" stop-color="#E8B13A" stop-opacity=".07"/>
      <stop offset="100%" stop-color="#E8B13A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0v72" fill="none" stroke="#F2F3F5" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#0A0B0D"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="150" cy="80" r="520" fill="url(#glow)"/>

  <g transform="translate(88 92)">
    <rect x="1" y="1" width="46" height="46" rx="11" fill="none" stroke="#F2F3F5" stroke-opacity=".35" stroke-width="2"/>
    <path d="M14 17h14M14 24h11M14 31h14" stroke="#F2F3F5" stroke-width="3.2" stroke-linecap="round"/>
    <circle cx="34" cy="24" r="3.6" fill="#E8B13A"/>
    <text x="64" y="33" fill="#F2F3F5" font-family="Segoe UI, system-ui, sans-serif" font-size="27" font-weight="700" letter-spacing="2.4">ECG</text>
  </g>

  <text x="88" y="268" fill="#A1A7B3" font-family="Consolas, monospace" font-size="19" letter-spacing="3.4">PLATAFORMA SOCIAL GLOBAL</text>

  <g fill="#F2F3F5" font-family="Segoe UI, system-ui, sans-serif" font-size="62" font-weight="650" letter-spacing="-1.8">
    <text x="88" y="350">Compite con tus ideas.</text>
    <text x="88" y="424">Destaca con tu <tspan fill="#E8B13A">talento</tspan>.</text>
    <text x="88" y="498">Crece con tus resultados.</text>
  </g>

  <rect x="88" y="548" width="196" height="4" rx="2" fill="#E8B13A"/>
